    - "DO NOT SCALE DRAWING. WORK TO STATED DIMENSIONS."

# ------------------------------------------------------------------------------
# Process Components (Primary Equipment, Boundaries, Supporting Mechanical Units)
# ------------------------------------------------------------------------------
components:
  # 1. Primary Physical Process Equipment (Vessels, Reactors, Modules)
  equipment:
    - id: "Mixer"
      name: "Stirred Tank Mixer"
      type: "Vessel"
      description: "Continuous stirred flocculation/adsorption tank"
      position: [200, 200]
      size: [60, 90]
      cap_length: 15
      internals:
        - type: "Stirrer"
      ports:
        - id: "In1"
          position: [0.0, 0.5]
          normal: [-1, 0]
          intent: "in"
          description: "Raw wastewater influent port"
        - id: "In2"
          position: [0.5, 0.0]
          normal: [0, -1]
          intent: "in"
          description: "Recycled/makeup IONP feed port"
        - id: "In3"
          position: [0.5, 1.0]
          normal: [0, 1]
          intent: "in"
          description: "NF retentate recycle port"
        - id: "Out"
          position: [1.0, 0.7]
          normal: [1, 0]
          intent: "out"
          description: "Flocculated slurry discharge port"
      text_anchor:
        horizontal: "Center"
        vertical: "Bottom"
        offset: [0, 25]

    - id: "DAF"
      name: "Flotation Separator"
      type: "Vessel"
      description: "Dissolved air flotation separator"
      position: [400, 203]
      size: [40, 120]
      cap_length: 15
      rotation: 90
      ports:
        - id: "In"
          position: [0.5, 1.0]
          normal: [0, 1]
          intent: "in"
          description: "Flocculated slurry feed inlet"
        - id: "Out_Float"
          position: [0.0, 0.25]
          normal: [-1, 0]
          intent: "out"
          description: "Flotation float/scum skim outlet (IONP-rich)"
        - id: "Out_Clarified"
          position: [1.0, 0.75]
          normal: [1, 0]
          intent: "out"
          description: "Clarified subnatant discharge outlet"
      text_anchor:
        horizontal: "Center"
        vertical: "Top"
        offset: [0, -15]

    - id: "UV/US"
      name: "UV/US Reactor"
      type: "Vessel"
      description: "Sonophotochemical AOP reactor with UV sleeves and US horns"
      position: [600, 80]
      size: [50, 95]
      cap_length: 15
      internals:
        - type: "Tubes"
          tubes: 4
      ports:
        - id: "In"
          position: [0.0, 0.75]
          normal: [-1, 0]
          intent: "in"
          description: "Float sludge / loaded IONP feed port"
        - id: "Out"
          position: [1.0, 0.25]
          normal: [1, 0]
          intent: "out"
          description: "Regenerated nanoparticle slurry outlet port"
      text_anchor:
        horizontal: "Center"
        vertical: "Bottom"
        offset: [0, 25]

    - id: "NF"
      name: "Nanofiltration Module"
      type: "Vessel"
      description: "Nanofiltration membrane pressure vessel"
      position: [600, 320]
      size: [40, 120]
      cap_length: 10
      rotation: 90
      internals:
        - type: "Tubes"
          tubes: 5
      ports:
        - id: "In"
          position: [0.5, 1.0]
          normal: [0, 1]
          intent: "in"
          description: "Clarified water feed inlet"
        - id: "Out_Permeate"
          position: [0.5, 0.0]
          normal: [0, -1]
          intent: "out"
          description: "Purified permeate product outlet"
        - id: "Out_Retentate"
          position: [1.0, 0.7]
          normal: [1, 0]
          intent: "out"
          description: "Concentrated retentate reject outlet"
      text_anchor:
        horizontal: "Center"
        vertical: "Bottom"
        offset: [0, -20]

  # 2. Process Boundaries / Stream Flags (Inputs & Outputs)
  stream_flags:
    - id: "Wastewater"
      name: "Wastewater Influent"
      type: "StreamFlag"
      role: "input"
      description: "Raw wastewater feed entering the treatment train"
      position: [40, 225]
      size: [40, 40]

    - id: "IONP"
      name: "IONP Feed"
      type: "StreamFlag"
      role: "input"
      description: "Iron oxide nanoparticles (makeup and recycled)"
      position: [210, 70]
      size: [40, 40]
      rotation: 90
      text_anchor:
        horizontal: "LeftOuter"
        vertical: "Center"
        offset: [-10, 0]

    - id: "Recovered IONP"
      name: "Recovered IONP"
      type: "StreamFlag"
      role: "output"
      description: "Regenerated iron oxide nanoparticles stream"
      position: [780, 85]
      size: [40, 40]

    - id: "Treated water"
      name: "Treated Water"
      type: "StreamFlag"
      role: "output"
      description: "Final purified water effluent"
      position: [780, 360]
      size: [40, 40]

  # 3. Motive Equipment: Pumps
  pumps:
    - id: "P-101"
      name: "Influent Feed Pump"
      type: "Pump"
      pump_technology: "Centrifugal"
      associated_stream: "S01"
      service: "Raw wastewater delivery from intake equalization to flash mixer"
      design_flow: "50 m3/h"
      design_head: "25 m"
      materials: "316L Stainless Steel"
      layout:
        center: [115, 245]
        orientation: "right"
        label_pos: "bottom"

    - id: "P-102"
      name: "IONP Slurry Dosing Pump"
      type: "Pump"
      pump_technology: "Progressive Cavity"
      associated_stream: "S09"
      service: "Precision positive-displacement metering of abrasive nanoparticle slurry"
      design_flow: "2.5 m3/h"
      design_head: "40 m"
      materials: "Hardened Tool Steel rotor / Viton stator"
      layout:
        center: [230, 138]
        orientation: "down"
        label_pos: "left"

    - id: "P-103"
      name: "Flocculated Slurry Transfer Pump"
      type: "Pump"
      pump_technology: "Low-Shear Centrifugal"
      associated_stream: "S02"
      service: "Low-shear transfer of flocculated slurry from Mixer to DAF without floc breakup"
      design_flow: "52.5 m3/h"
      design_head: "15 m"
      materials: "Rubber-lined casing / 316L SS impeller"
      layout:
        center: [300, 263]
        orientation: "right"
        label_pos: "bottom"

    - id: "P-105"
      name: "Float Sludge Transfer Pump"
      type: "Pump"
      pump_technology: "Progressive Cavity"
      associated_stream: "S03"
      service: "Transfer of thickened DAF float scum / loaded IONPs to UV/US reactor"
      design_flow: "4.0 m3/h"
      design_head: "35 m"
      materials: "Duplex SS rotor / NBR stator"
      layout:
        center: [490, 150]
        orientation: "right"
        label_pos: "bottom"

    - id: "P-106"
      name: "NF High-Pressure Booster Pump"
      type: "Pump"
      pump_technology: "Multi-Stage Centrifugal"
      associated_stream: "S04"
      service: "High-pressure feed to nanofiltration membrane elements"
      design_flow: "48.5 m3/h"
      design_head: "110 m (11 bar)"
      materials: "Super Duplex SS (2507)"
      layout:
        center: [485, 290]
        orientation: "right"
        label_pos: "bottom"

    - id: "P-107"
      name: "Regenerated Slurry Recovery Pump"
      type: "Pump"
      pump_technology: "Peristaltic Hose Pump"
      associated_stream: "S07"
      service: "Transfer of regenerated nanoparticle slurry from UV/US reactor to recovery buffer"
      design_flow: "4.0 m3/h"
      design_head: "20 m"
      materials: "EPDM reinforced hose / 316 SS inserts"
      layout:
        center: [690, 105]
        orientation: "right"
        label_pos: "bottom"

  # 4. Process Valves (Regulation, Non-Return, Safety, and Sampling Tees)
  valves:
    # Control Valves
    - id: "FCV-101"
      name: "Influent Flow Control Valve"
      type: "ControlValve"
      valve_pattern: "Globe"
      actuation: "Pneumatic Diaphragm"
      normal_state: "Fail-Closed"
      associated_stream: "S01"
      service: "Modulates influent raw wastewater rate based on plant throughput setpoint"
      layout:
        center: [165, 245]
        orientation: "horizontal"
        label_pos: "bottom"

    - id: "PCV-101"
      name: "NF Retentate Pressure Control Valve"
      type: "ControlValve"
      valve_pattern: "Angle / Severe Service Needle"
      actuation: "Electric Actuator"
      normal_state: "Fail-Open"
      associated_stream: "S05"
      service: "Regulates membrane transmembrane pressure (TMP) and concentration recovery ratio"
      layout:
        center: [500, 440]
        orientation: "horizontal"
        label_pos: "bottom"

    # Non-Return (Check) Valves
    - id: "CKV-101"
      name: "Influent Discharge Check Valve"
      type: "CheckValve"
      valve_pattern: "Swing Check"
      associated_stream: "S01"
      service: "Prevents reverse flow from Mixer tank into P-101 discharge"
      layout:
        center: [140, 245]
        orientation: "right"
        label_pos: "top"

    - id: "CKV-102"
      name: "Permeate Non-Return Valve"
      type: "CheckValve"
      valve_pattern: "Dual Plate Wafer Check"
      associated_stream: "S06"
      service: "Protects membrane elements against reverse pressurization and delamination"
      layout:
        center: [710, 380]
        orientation: "right"
        label_pos: "top"

    - id: "CKV-103"
      name: "Retentate Recycle Check Valve"
      type: "CheckValve"
      valve_pattern: "Piston Check"
      associated_stream: "S05"
      service: "Prevents backflow from Mixer bottom head into NF housing during shutdown"
      layout:
        center: [340, 440]
        orientation: "left"
        label_pos: "bottom"

    - id: "CKV-104"
      name: "IONP Recycle Check Valve"
      type: "CheckValve"
      valve_pattern: "Spring-Loaded Ball Check"
      associated_stream: "S08"
      service: "Prevents reverse flow from dosing head into UV/US regeneration vessel"
      layout:
        center: [500, 55]
        orientation: "left"
        label_pos: "top"

    # Safety Relief Valves
    - id: "PSV-101"
      name: "Membrane High-Pressure Safety Relief Valve"
      type: "SafetyReliefValve"
      valve_pattern: "Spring-Loaded Relief"
      set_pressure: "14 bar"
      associated_stream: "S04"
      service: "Protects NF membrane housing and piping from hydraulic overpressurization"
      layout:
        center: [530, 290]
        orientation: "up"
        label_pos: "right"

    # Sampling Valves (Tee Off Points Between Each Major Processing Stage)
    - id: "V-SMP-01"
      name: "Influent Grab Sample Valve"
      type: "SamplingValve"
      valve_pattern: "Needle Valve"
      associated_stream: "S01"
      service: "Raw wastewater baseline analysis (COD, TOC, TSS, pH, heavy metals)"
      layout:
        tap: [182, 245]
        branch: [182, 272]
        label_pos: "bottom"

    - id: "V-SMP-02"
      name: "Flocculated Mixture Sample Valve"
      type: "SamplingValve"
      valve_pattern: "Diaphragm / Pinch Valve"
      associated_stream: "S02"
      service: "Flocculation efficiency, floc size distribution, residual dissolved contaminants"
      layout:
        tap: [335, 263]
        branch: [335, 290]
        label_pos: "bottom"

    - id: "V-SMP-03"
      name: "Float Sludge Sample Valve"
      type: "SamplingValve"
      valve_pattern: "Plug / Ram Valve"
      associated_stream: "S03"
      service: "Thickened float solids concentration, loaded nanoparticle contaminant uptake"
      layout:
        tap: [555, 150]
        branch: [555, 178]
        label_pos: "bottom"

    - id: "V-SMP-04"
      name: "Clarified Water Sample Valve"
      type: "SamplingValve"
      valve_pattern: "Needle Valve"
      associated_stream: "S04"
      service: "Clarified subnatant quality, residual turbidity, silt density index (SDI15)"
      layout:
        tap: [550, 335]
        branch: [520, 335]
        label_pos: "left"

    - id: "V-SMP-05"
      name: "NF Retentate Sample Valve"
      type: "SamplingValve"
      valve_pattern: "Needle Valve"
      associated_stream: "S05"
      service: "Concentrate reject characterization, scaling mineral supersaturation monitoring"
      layout:
        tap: [435, 440]
        branch: [435, 465]
        label_pos: "bottom"

    - id: "V-SMP-06"
      name: "Treated Permeate Sample Valve"
      type: "SamplingValve"
      valve_pattern: "Sanitary Diaphragm Valve"
      associated_stream: "S06"
      service: "Final treated effluent regulatory compliance testing (TOC, micropollutants, TDS)"
      layout:
        tap: [745, 380]
        branch: [745, 408]
        label_pos: "left"

    - id: "V-SMP-07"
      name: "Regenerated IONP Sample Valve"
      type: "SamplingValve"
      valve_pattern: "Diaphragm Valve"
      associated_stream: "S07"
      service: "Desorption & degradation efficiency, nanoparticle surface functionalization check"
      layout:
        tap: [735, 105]
        branch: [735, 132]
        label_pos: "left"

    - id: "V-SMP-08"
      name: "Recycled Slurry Loop Sample Valve"
      type: "SamplingValve"
      valve_pattern: "Diaphragm Valve"
      associated_stream: "S08"
      service: "Recycled slurry density and solids content check"
      layout:
        tap: [420, 55]
        branch: [420, 30]
        label_pos: "top"

    - id: "V-SMP-09"
      name: "IONP Dosing Feed Sample Valve"
      type: "SamplingValve"
      valve_pattern: "Diaphragm Valve"
      associated_stream: "S09"
      service: "Fresh/makeup and blended nanoparticle dosing quality verification"
      layout:
        tap: [230, 172]
        branch: [255, 172]
        label_pos: "right"

  # 5. Process Instrumentation & Sensors (ISA-5.1 Tags)
  instrumentation:
    - tag: "FIT-101"
      name: "Influent Flow Transmitter"
      variable: "Flow"
      instrument_type: "Electromagnetic Flow Meter"
      associated_stream: "S01"
      service: "Raw wastewater feed flow measurement for pacing IONP dosing ratio"
      layout:
        center: [136, 205]
        tap: [136, 245]

    - tag: "AIT-101A"
      name: "Feed pH Transmitter"
      variable: "pH"
      instrument_type: "Glass Electrode / Preamplifier"
      associated_stream: "S01"
      service: "Influent pH verification to optimize nanoparticle surface sorption window"
      layout:
        center: [160, 220]
        tap: [160, 245]

    - tag: "AIT-101B"
      name: "Feed Turbidity Sensor"
      variable: "Turbidity"
      instrument_type: "Nephelometric Turbidimeter (ISO 7027)"
      associated_stream: "S01"
      service: "Monitors incoming suspended solids to bias chemical dosage"
      layout:
        center: [184, 205]
        tap: [184, 245]

    - tag: "FIT-102"
      name: "IONP Dosing Flow Transmitter"
      variable: "Flow"
      instrument_type: "Coriolis Mass Flow Meter"
      associated_stream: "S09"
      service: "Direct mass flow monitoring of abrasive nanoparticle slurry"
      layout:
        center: [275, 138]
        tap: [230, 138]

    - tag: "LIT-101"
      name: "Mixer Level Transmitter"
      variable: "Level"
      instrument_type: "Guided Wave Radar"
      associated_unit: "Mixer"
      service: "Continuous tank level control; high-level alarm and P-103 dry-run protection"
      layout:
        center: [165, 175]
        tap: [200, 215]

    - tag: "FIT-103"
      name: "Flocculated Slurry Flow Transmitter"
      variable: "Flow"
      instrument_type: "Electromagnetic Flow Meter"
      associated_stream: "S02"
      service: "Monitors slurry feed rate into DAF flotation separator"
      layout:
        center: [300, 220]
        tap: [300, 263]

    - tag: "LIT-102"
      name: "DAF Level Transmitter"
      variable: "Level"
      instrument_type: "Hydrostatic Pressure Transmitter"
      associated_unit: "DAF"
      service: "Maintains liquid subnatant level to optimize surface skimmer depth"
      layout:
        center: [420, 205]
        tap: [420, 243]

    - tag: "AIT-103"
      name: "Float Sludge TSS Density Transmitter"
      variable: "Density / TSS"
      instrument_type: "Microwave / Optical Absorption Sensor"
      associated_stream: "S03"
      service: "Measures solids concentration of floated nanoparticle scum"
      layout:
        center: [525, 110]
        tap: [525, 150]

    - tag: "AIT-104"
      name: "Clarified Water Turbidity Monitor"
      variable: "Turbidity"
      instrument_type: "Laser / Scattered Light Turbidimeter"
      associated_stream: "S04"
      service: "Critical membrane safeguard: interlocks P-106 on pin-floc carryover"
      layout:
        center: [415, 335]
        tap: [415, 290]

    - tag: "PIT-101"
      name: "Membrane Feed Pressure Transmitter"
      variable: "Pressure"
      instrument_type: "Piezoresistive Pressure Transmitter"
      associated_stream: "S04"
      service: "Monitors P-106 discharge pressure to prevent membrane overpressure"
      layout:
        center: [500, 250]
        tap: [500, 290]

    - tag: "PDIT-101"
      name: "Membrane Differential Pressure Transmitter"
      variable: "DifferentialPressure"
      instrument_type: "DP Cell Transmitter"
      measured_across: ["NF:In", "NF:Out_Retentate"]
      service: "Direct indicator of membrane fouling / cake layer formation; triggers CIP"
      layout:
        center: [610, 445]
        tap: [596, 400]

    - tag: "FIT-106"
      name: "Permeate Flow Transmitter"
      variable: "Flow"
      instrument_type: "Electromagnetic Flow Meter"
      associated_stream: "S06"
      service: "Measures clean water production rate and computes membrane specific flux"
      layout:
        center: [730, 340]
        tap: [730, 380]

    - tag: "AIT-105"
      name: "Permeate Conductivity Analyzer"
      variable: "Conductivity"
      instrument_type: "Toroidal Conductivity Sensor"
      associated_stream: "S06"
      service: "Online verification of salt/ion rejection and membrane integrity"
      layout:
        center: [760, 315]
        tap: [760, 380]

    - tag: "AIT-106"
      name: "UV Intensity Radiometer"
      variable: "UV_Intensity"
      instrument_type: "Silicon Photodiode Radiometer"
      associated_unit: "UV/US"
      service: "Monitors UV quartz sleeve fouling and lamp aging in AOP chamber"
      layout:
        center: [670, 45]
        tap: [640, 80]

    - tag: "TT-101"
      name: "Reactor Chamber Temperature Transmitter"
      variable: "Temperature"
      instrument_type: "Pt100 RTD Sensor"
      associated_unit: "UV/US"
      service: "Thermal alarm protecting against ultrasonic transducer acoustic heat buildup"
      layout:
        center: [580, 45]
        tap: [610, 80]

    - tag: "FIT-108"
      name: "Nanoparticle Recycle Flow Transmitter"
      variable: "Flow"
      instrument_type: "Electromagnetic Flow Meter"
      associated_stream: "S08"
      service: "Measures recycled nanoparticle slurry mass/volumetric return flow"
      layout:
        center: [730, 20]
        tap: [730, 55]

# ------------------------------------------------------------------------------
# Process Macro Streams & Associated Line Components
# ------------------------------------------------------------------------------
streams:
  # S01: Wastewater Influent Line
  - id: "S01"
    name: "Raw wastewater influent"
    description: "Wastewater -> Mixer (Influent feed)"
    from:
      unit: "Wastewater"
      port: "Out"
    to:
      unit: "Mixer"
      port: "In1"
    associated_components:
      pumps: ["P-101"]
      valves: ["FCV-101", "CKV-101", "V-SMP-01"]
      instruments: ["FIT-101", "AIT-101A", "AIT-101B"]
      line_sequence:
        - "Wastewater:Out"
        - "P-101 (Influent Feed Pump)"
        - "CKV-101 (Discharge Check Valve)"
        - "FIT-101 (Flow Transmitter)"
        - "AIT-101A (pH Analyzer)"
        - "AIT-101B (Turbidity Sensor)"
        - "FCV-101 (Flow Control Valve)"
        - "V-SMP-01 (Influent Grab Sample Valve)"
        - "Mixer:In1"

  # S02: Flocculated Slurry Transfer Line
  - id: "S02"
    name: "Flocculated slurry"
    description: "Mixer -> DAF (Flocculated mixture)"
    from:
      unit: "Mixer"
      port: "Out"
    to:
      unit: "DAF"
      port: "In"
    associated_components:
      pumps: ["P-103"]
      valves: ["V-SMP-02"]
      instruments: ["FIT-103"]
      line_sequence:
        - "Mixer:Out"
        - "P-103 (Low-Shear Slurry Pump)"
        - "FIT-103 (Slurry Flow Transmitter)"
        - "V-SMP-02 (Flocculated Slurry Sample Valve)"
        - "DAF:In"

  # S03: Float Scum / Loaded IONP Line
  - id: "S03"
    name: "Flotation float/scum"
    description: "DAF -> UV/US (Flotation sludge / loaded IONP)"
    from:
      unit: "DAF"
      port: "Out_Float"
    to:
      unit: "UV/US"
      port: "In"
    label_offset: [10, -10]
    associated_components:
      pumps: ["P-105"]
      valves: ["V-SMP-03"]
      instruments: ["AIT-103"]
      line_sequence:
        - "DAF:Out_Float"
        - "P-105 (Float Sludge Cavity Pump)"
        - "AIT-103 (Sludge TSS Density Transmitter)"
        - "V-SMP-03 (Float Sludge Sample Valve)"
        - "UV/US:In"

  # S04: Clarified Subnatant Line (Membrane Feed)
  - id: "S04"
    name: "Clarified subnatant"
    description: "DAF -> NF (Clarified liquid phase)"
    from:
      unit: "DAF"
      port: "Out_Clarified"
    to:
      unit: "NF"
      port: "In"
    label_offset: [10, 15]
    associated_components:
      pumps: ["P-106"]
      valves: ["PSV-101", "V-SMP-04"]
      instruments: ["AIT-104", "PIT-101"]
      line_sequence:
        - "DAF:Out_Clarified"
