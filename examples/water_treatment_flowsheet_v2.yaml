  units: "MILLIMETERS [MM]"
  projection: "THIRD ANGLE"
  code_standard: "ANSI/ASME Y14.1 / ISA-5.1"
  description: >
    Water treatment process flow diagram and P&ID model with physical equipment
    vessels, motive pumps, control & safety valves, in-line grab sampling tees,
    and ISA-5.1 process instrumentation.
  revisions:
    - rev: "A"
      description: "INITIAL PROCESS DESIGN RELEASE"
      zone: "-"
      date: "2026-09-01"
