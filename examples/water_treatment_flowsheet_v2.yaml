  name: "Detailed Process Flow Diagram & P&ID Specification"
  title: "WATER TREATMENT WITH IONP RECOVERY"
  subtitle: "PROCESS FLOW DIAGRAM & PIPING/INSTRUMENTATION (P&ID)"
  drawing_number: "DWG-PFD-WT-002"
  revision: "B"
  sheet_size: "D"
  scale: "NTS"
  sheet: "1 OF 1"
  cage_code: "1A2B3"
  organization: "ADVANCED WATER SYSTEMS & RESOURCE RECOVERY"
  project: "IONP CATALYTIC PURIFICATION PILOT"
  contract_no: "WTR-2026-ENG-44"
  status: "ISSUED FOR CONSTRUCTION"
  drawn_by: "E. Vance"
  drawn_date: "2026-09-20"
  checked_by: "M. Roberts"
  checked_date: "2026-09-21"
  approved_by: "H. Green"
  approved_date: "2026-09-22"
  qa_by: "D. Martinez"
